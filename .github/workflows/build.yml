                      CategoryItem(1L, ShortcutCategory.CLASS_NOTES, "Skill Competition Notes", "MVVM + Jetpack Compose architecture", "Today"),
                      CategoryItem(2L, ShortcutCategory.IMPORTANT, "Project Submission", "All 27 modules catalogued", "Today")
                  )
              }

              NavHost(
                  navController = navController,
                  startDestination = if (prefs.onboarded) "dashboard" else "onboarding"
              ) {
                  composable("onboarding") {
                      var input by reme
