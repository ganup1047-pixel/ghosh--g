              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M54,28C39.64,28 28,39.64 28,54C28,68.36 39.64,80 54,80C66.82,80 77.45,70.72 79.6,58.5H54V50.5H80V54C80,70.57 68.57,82 54,82C38.54,82 26,69.46 26,54C26,38.54 38.54,26 54,26C61.42,26 68.16,28.89 73.18,33.62L67.52,39.28C63.94,35.98 59.2,34 54,34V28Z" />
              <path
                  android:fillColor="#FFFBBF24"
                  android:pathData="M71,36m-5,0a5,5 0,1 1,10 0a5,5 0,1 1,-10 0" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/java/com/ghoshg/app/MainActivity.kt
