              ModuleItem(23, "GPS Speedometer", "Filtered live km/h & mph speed gauge", Icons.Outlined.Speed, Color(0xFFEF4444)),
              ModuleItem(24, "Charging Animation", "Live battery state & charging visual themes", Icons.Outlined.BatteryChargingFull, Color(0xFF22C55E)),
              ModuleItem(25, "Harmony & Piano", "Playable multi-touch synthesized piano keyboard", Icons.Outlined.Piano, Color(0xFF3B82F6)),
              ModuleItem(26, "Music Visualizer", "Real-time audio spectrum & waveform themes", Icons.Outlined.GraphicEq, Color(0xFFA855F7)),
