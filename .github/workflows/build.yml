          class MainActivity : ComponentActivity() {
              private val NAME_KEY = stringPreferencesKey("first_name")
              private val ONBOARD_KEY = booleanPreferencesKey("onboarded")
              private val THEME_KEY = stringPreferencesKey("theme_mode")
              private val LOCK_KEY = booleanPreferencesKey("app_lock")

              override fun onCreate(savedInstanceState: Bundle?) {
                  val splash = installSplashScreen()
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()

                  val prefsFlow = applicationContext.dataStore.data.map { p ->
                      val theme = runCatching { AppThemeMode.valueOf(p[THEME_KEY] ?: "LIGHT_BRIGHT") }
                          .getOrDefault(AppThemeMode.LIGHT_BRIGHT)
                      UserPrefs(
                          firstName = p[NAME_KEY] ?: "",
                          onboarded = p[ONBOARD_KEY] ?: false,
                          themeMode = theme,
                          appLockEnabled = p[LOCK_KEY] ?: false
                      )
                  }.stateIn(lifecycleScope, SharingStarted.Eagerly, null)

                  splash.setKeepOnScreenCondition { prefsFlow.value == null }

                  setContent {
                      val prefs by prefsFlow.collectAsStateWithLifecycle()
                      val current = prefs ?: return@setContent

                      LaunchedEffect(current.appLockEnabled) {
                          if (current.appLockEnabled) {
                              window.setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE)
                          } else {
                              window.clearFlags(WindowManager.LayoutParams.FLAG_SECURE)
                          }
                      }

                      val isDark = when (current.themeMode) {
                          AppThemeMode.LIGHT_BRIGHT -> false
                          AppThemeMode.DARK -> true
                          AppThemeMode.SYSTEM -> isSystemInDarkTheme()
                      }

                      MaterialTheme(
                          colorScheme = if (isDark) darkColorScheme(
                              primary = Color(0xFF818CF8),
                              secondary = Color(0xFFC084FC),
                              background = Color(0xFF0B0F19),
                              surface = Color(0xFF111827)
                          ) else lightColorScheme(
                              primary = Color(0xFF4338CA),
                              secondary = Color(0xFF9333EA),
                              background = Color(0xFFF8FAFC),
                              surface = Color(0xFFFFFFFF)
                          )
                      ) {
                          GhoshGApp(
                              prefs = current,
                              onSaveName = { name ->
                                  lifecycleScope.launch {
                                      applicationContext.dataStore.edit {
                                          it[NAME_KEY] = name.trim()
                                          it[ONBOARD_KEY] = true
                                      }
                                  }
                              },
                              onSaveTheme = { mode ->
                                  lifecycleScope.launch {
                                      applicationContext.dataStore.edit { it[THEME_KEY] = mode.name }
                                  }
                              },
                              onToggleLock = { enabled ->
                                  lifecycleScope.launch {
                                      applicationContext.dataStore.edit { it[LOCK_KEY] = enabled }
                                  }
                              }
                          )
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun GhoshGApp(
              prefs: UserPrefs,
              onSaveName: (String) -> Unit,
              onSaveTheme: (AppThemeMode) -> Unit,
              onToggleLock: (Boolean) -> Unit
          ) {
              val navController = rememberNavController()
              val categoryItems = remember {
