              val onboarded: Boolean = false,
              val themeMode: AppThemeMode = AppThemeMode.LIGHT_BRIGHT,
              val appLockEnabled: Boolean = false
          ) {
              val identity: String
                  get() = if (firstName.isBlank()) "Ghosh g" else "${firstName.trim()} Ghosh g"
          }

          enum class ShortcutCategory(val id: String, val label: String, val icon: ImageVector, val color: Color) {
              NOTE_PDF("note_pdf", "Note PDF", Icons.Outlined.PictureAsPdf, Color(0xFFE11D48)),
              CLASS_NOTES("class_notes", "Class Notes", Icons.Outlined.MenuBook, Color(0xFF4F46E5)),
              PHOTO("photo", "Photo", Icons.Outlined.PhotoLibrary, Color(0xFF059669)),
              VIDEO("video", "Video", Icons.Outlined.VideoLibrary, Color(0xFFD97706)),
              IMPORTANT("important", "Important", Icons.Outlined.StarOutline, Color(0xFF9333EA)),
              EXAM("exam", "Exam", Icons.Outlined.School, Color(0xFF0284C7))
          }

          data class CategoryItem(val id: Long, val category: ShortcutCategory, val title: String, val details: String, val time: String)
          data class ModuleItem(val number: Int, val title: String, val subtitle: String, val icon: ImageVector, val color: Color)

          val all27Modules = listOf(
              ModuleItem(2, "Notes & Painting", "Unicode notes, PDF export & PNG drawing canvas", Icons.Outlined.EditNote, Color(0xFF4F46E5)),
              ModuleItem(3, "Task Manager", "To-dos, overdue badges & custom sound alarms", Icons.Outlined.CheckCircle, Color(0xFF059669)),
